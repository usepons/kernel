<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- Pons Logo — Color: Seed transitions from warm earth to cool neural -->
  <defs>
    <linearGradient id="stem-left" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#5A8A96"/>
    </linearGradient>
    <linearGradient id="stem-right" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#4A7F8C"/>
    </linearGradient>
  </defs>

  <g transform="translate(68, 84)">
    <!-- Seed — deep navy -->
    <path d="M 0,22 C -7,17 -10,9 -6,3 C -3,-1 3,-1 6,3 C 10,9 7,17 0,22Z" fill="#1B2A4A"/>

    <!-- Two rising stems — gradient from warm to cool -->
    <path d="M -2,3 C -3,-6 0,-16 -6,-30" stroke="url(#stem-left)" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 2,3 C 5,-6 8,-18 16,-32" stroke="url(#stem-right)" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- Left network — primary hub -->
    <circle cx="-6" cy="-30" r="3.2" fill="#5A8A96"/>

    <!-- Left branches -->
    <path d="M -6,-30 C -16,-33 -24,-28 -34,-32" stroke="#5A8A96" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <circle cx="-34" cy="-32" r="2.8" fill="#6BA3AE"/>

    <path d="M -6,-30 C -10,-40 -16,-46 -22,-50" stroke="#6BA3AE" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <circle cx="-22" cy="-50" r="2.2" fill="#7DBAC4"/>

    <path d="M -6,-30 C -2,-38 -4,-44 -8,-52" stroke="#7DBAC4" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <circle cx="-8" cy="-52" r="1.8" fill="#8ECAD3"/>

    <!-- Left tertiary -->
    <path d="M -34,-32 C -38,-38 -36,-44 -40,-50" stroke="#7DBAC4" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <circle cx="-40" cy="-50" r="1.4" fill="#8ECAD3"/>

    <path d="M -34,-32 C -40,-30 -44,-34 -48,-36" stroke="#7DBAC4" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <circle cx="-48" cy="-36" r="1.4" fill="#8ECAD3"/>

    <!-- Right network — primary hub -->
    <circle cx="16" cy="-32" r="3.2" fill="#5A8A96"/>

    <!-- Right branches -->
    <path d="M 16,-32 C 26,-36 32,-30 40,-34" stroke="#5A8A96" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="-34" r="2.8" fill="#6BA3AE"/>

    <path d="M 16,-32 C 18,-42 22,-50 20,-56" stroke="#6BA3AE" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <circle cx="20" cy="-56" r="2.2" fill="#7DBAC4"/>

    <path d="M 16,-32 C 12,-40 14,-48 10,-54" stroke="#7DBAC4" stroke-width="0.9" fill="none" stroke-linecap="round"/>
    <circle cx="10" cy="-54" r="1.8" fill="#8ECAD3"/>

    <!-- Right tertiary -->
    <path d="M 40,-34 C 44,-40 42,-46 46,-52" stroke="#7DBAC4" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <circle cx="46" cy="-52" r="1.4" fill="#8ECAD3"/>

    <path d="M 40,-34 C 46,-32 50,-36 54,-38" stroke="#7DBAC4" stroke-width="0.7" fill="none" stroke-linecap="round"/>
    <circle cx="54" cy="-38" r="1.4" fill="#8ECAD3"/>

    <!-- Cross-connections -->
    <path d="M -6,-30 C 2,-34 10,-34 16,-32" stroke="#5A8A96" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-dasharray="2,3" opacity="0.6"/>
    <path d="M -22,-50 C -10,-54 6,-56 20,-56" stroke="#7DBAC4" stroke-width="0.5" fill="none" stroke-linecap="round" stroke-dasharray="1.5,2.5" opacity="0.5"/>
  </g>
</svg>
